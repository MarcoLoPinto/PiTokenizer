[project]
name = "pitokenizer"
version = "0.1.0"
description = "Small, from-scratch tokenizer implementations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0.3",
    "regex>=2026.1.15",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pitokenizer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
